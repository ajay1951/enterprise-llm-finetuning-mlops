name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install tools
        run: pip install ruff bandit
        
      - name: Ruff Format Check
        run: ruff format --check src/ tests/
        
      - name: Ruff Linting
        run: ruff check src/ tests/
        
      - name: Bandit Security Scan
        # Ignore B603, B607, B615, B404, B110 which are common false positives in ML code
        run: bandit -r src/ -s B603,B607,B615,B404,B110

  test:
    name: Unit & Integration Tests
    needs: lint-and-security
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: forgellm
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: forgellm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -e .

          
      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://forgellm:password123@localhost:5432/forgellm_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: pytest tests/ --cov=src --cov-report=xml

  docker-build:
    name: Validate Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: forgellm-api:${{ github.sha }}
          outputs: type=docker,dest=/tmp/forgellm-api.tar
          
      - name: Build Celery Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.celery
          push: false
          tags: forgellm-celery:${{ github.sha }}
          outputs: type=docker,dest=/tmp/forgellm-celery.tar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-ready-images
          path: /tmp/*.tar
          retention-days: 5

  llm-evaluation:
    name: LLM Quality Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -e .

          
      - name: Start MLflow Background Service
        run: |
          mlflow server --host 127.0.0.1 --port 5000 &
          sleep 5
          
      - name: Run Quality Gate Demonstrations
        run: |
          pytest tests/test_evaluation_regression.py tests/test_quality_gate.py


