model:
  name: "Qwen/Qwen2.5-0.5B"
  model_version: "v1.0.0"
  tokenizer_name: null
  trust_remote_code: true

dataset:
  train_file: "tests/fixtures/sample_dataset.jsonl"
  val_file: null
  version: "v1.0-micro"
  validation_split: 0.2
  test_split: 0.1
  seed: 42
  max_seq_length: 512

training:
  experiment_name: "ForgeLLM_Phase3_Benchmark"
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  output_dir: "outputs/phase3_micro_experiment"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 10
  eval_steps: 0
  seed: 42

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

quantization:
  enabled: false
  bits: 4
