global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'forgellm-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  - job_name: 'forgellm-inference'
    static_configs:
      - targets: ['vllm_service:8080']
    metrics_path: '/metrics'
