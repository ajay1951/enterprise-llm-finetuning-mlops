# Default values for forgellm.

global:
  environment: production
  
api:
  replicaCount: 2
  image:
    repository: forgellm-api
    tag: "latest"
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 1
      memory: 2Gi
      
worker:
  replicaCount: 3
  image:
    repository: forgellm-worker
    tag: "latest"
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 16Gi
    requests:
      nvidia.com/gpu: 1
      memory: 8Gi

redis:
  enabled: true
  architecture: standalone

postgresql:
  enabled: true
  
minio:
  enabled: true
  
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
