replicaCount: 2

image:
  repository: forgellm
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: forgellm.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 500m
    memory: 1Gi

env:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/forgellm"
  REDIS_URL: "redis://redis-service:6379/0"
