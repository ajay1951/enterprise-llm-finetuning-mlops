[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgellm"
version = "0.1.0"
description = "Open-Source LLM Fine-Tuning Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "trl>=0.7.11",
    "peft>=0.8.2",
    "accelerate>=0.27.2",
    "bitsandbytes>=0.42.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
forge = "forgellm.cli.main:app"
