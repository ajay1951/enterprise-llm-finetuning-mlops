model:
  name: "Qwen/Qwen2.5-0.5B"
  trust_remote_code: true

dataset:
  train_file: "data/raw/train.jsonl"
  validation_split: 0.1
  seed: 42
  max_seq_length: 2048

training:
  output_dir: "outputs"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05

quantization:
  enabled: true
  bits: 4
