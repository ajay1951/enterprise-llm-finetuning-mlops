model: Qwen/Qwen2.5-0.5B
quantization:
  enabled: true
  bits: 4
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
training:
  batch_size: 1
  gradient_accumulation_steps: 4
  epochs: 3
  learning_rate: 2e-4
  max_length: 512
