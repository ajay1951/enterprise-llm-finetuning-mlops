model:
  name: Qwen/Qwen2.5-0.5B
quantization:
  enabled: true
  bits: 4
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
dataset:
  max_seq_length: 512
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 2e-4
